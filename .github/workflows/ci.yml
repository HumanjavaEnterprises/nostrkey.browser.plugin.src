name: CI
on:
  push: {}                 # every push, any branch
  pull_request:
    branches: [main]
  workflow_dispatch: {}    # manual runs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'   # single source of truth (Node 24)
          cache: 'npm'
      - run: npm ci
      - run: npm run build:all:prod
      - run: npm test
      # Production-affecting CVEs only — dev-tooling advisories must not red the build.
      - run: npm audit --omit=dev --audit-level=high
      # Xcode Cloud ships the committed distros/safari, so it must match src/.
      - name: distros/safari matches src
        run: |
          npm run build
          drift="$(git status --porcelain distros/safari)"
          echo "$drift"
          test -z "$drift"

  # Consent surface and settings e2e — GATES the build. Loads the real extension in
  # Chromium, hermetic (routed fixture, service-worker-seeded demo profile, no
  # network). Chromium extensions require a headed browser, so CI runs it under an
  # xvfb virtual display.
  e2e-consent:
    name: e2e — consent surface + settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm run build:chrome
      - name: consent surface, grant list and tab bar specs
        run: xvfb-run -a npm run test:e2e:consent
      - name: settings persistence spec
        run: xvfb-run -a npm run test:e2e:settings
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-consent-results
          path: test-results/
          retention-days: 7

  # The consent flow in real Firefox (Selenium + geckodriver, headless), against
  # the built add-on. Hermetic: sites are *.localhost and every other address goes
  # to a closed local port.
  e2e-firefox-consent:
    name: e2e — Firefox consent flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:firefox:prod
      - run: npm run test:e2e:firefox:consent

  # Extension page smoke tests, also hermetic. Non-gating, so failures don't red
  # the build.
  e2e-extension:
    name: e2e — extension pages (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm run build:chrome
      - run: xvfb-run -a npx playwright test test/e2e/extension.spec.js
