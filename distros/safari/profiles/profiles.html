<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="/a11y.js"></script>
        <script defer src="profiles.build.js"></script>
        <link rel="stylesheet" href="/options.build.css" />
        <link rel="stylesheet" href="/instrument.css" />
        <link rel="stylesheet" href="/profiles/profiles.css" />
        <title>Manage Profiles</title>
    </head>
    <body class="ins">
        <main class="pf-container">
            <header class="pf-head">
                <div class="micro-label">NostrKey &middot; Identity Rack</div>
                <h1 class="pf-title">Manage Profiles</h1>
                <p class="pf-sub">
                    Each profile is a signing identity in the rack. The active identity carries the signal
                    <span class="led led--signal" aria-hidden="true"></span>.
                    Select modules to remove them &mdash; deletion cannot be undone.
                </p>
            </header>

            <section class="rack" aria-label="Profile rack">
                <div class="module-header">
                    Identities
                    <span class="header-end">
                        <span id="count-text" class="pf-count mono"></span>
                        <button id="create-profile-btn" class="btn btn--sm btn--primary" type="button" title="Create a new signing identity">+ New Profile</button>
                    </span>
                </div>
                <ul id="profile-list" class="profile-list" role="listbox" aria-multiselectable="true" aria-label="Profiles">
                    <li class="pf-empty">Loading profiles&hellip;</li>
                </ul>
            </section>

            <div class="pf-legend micro-label" aria-hidden="true">
                <span class="led-label"><span class="led led--signal"></span>Active</span>
                <span class="led-label"><span class="led led--green"></span>Key loaded</span>
                <span class="led-label"><span class="led led--red"></span>Key unreadable</span>
                <span class="led-label"><span class="led led--amber"></span>Duplicate</span>
            </div>

            <p id="warning-text" class="warn-strip warn-strip--amber hidden" role="alert"></p>
            <p id="success-text" class="pf-success hidden" role="status"></p>

            <div class="actions-bar">
                <button id="select-all-btn" class="btn" type="button">Select All</button>
                <button id="delete-selected-btn" class="btn btn--destructive" type="button" disabled>Delete Selected (0)</button>
            </div>
        </main>
    </body>
</html>
