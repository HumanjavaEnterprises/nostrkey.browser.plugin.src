<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="a11y.js"></script>
        <script defer src="profile.build.js"></script>
        <link rel="stylesheet" href="options.build.css" />
        <link rel="stylesheet" href="instrument.css" />
        <link rel="stylesheet" href="profile.css" />
        <title>Profile, NostrKey</title>
    </head>
    <body class="ins" data-state="loading">
        <main class="pd-container">
            <header class="pd-head">
                <div class="micro-label">NostrKey &middot; Profile</div>
                <h1 class="pd-title" id="pd-title">Profile</h1>
                <p class="pd-npub mono" id="pd-npub"></p>
            </header>

            <p class="pd-locked" id="pd-locked" role="status" hidden></p>

            <section class="rack" aria-labelledby="pd-section-title">
                <div class="module-header" id="pd-section-title">Public profile</div>
                <div class="module-body pd-body">
                    <p class="pd-message" id="pd-message" role="status" aria-live="polite"></p>
                    <dl class="pd-fields" id="pd-fields"></dl>
                    <div class="pd-actions">
                        <button id="pd-retry" class="btn btn--sm" type="button" hidden>Retry</button>
                        <button id="pd-create" class="btn btn--primary btn--sm" type="button" disabled hidden>Create your profile</button>
                        <button id="pd-edit" class="btn btn--sm" type="button" disabled aria-describedby="pd-edit-reason">Edit</button>
                        <span class="pd-edit-reason help-text" id="pd-edit-reason"></span>
                    </div>
                    <p class="pd-save-result" id="pd-save-result" role="status" aria-live="polite" hidden></p>
                    <form class="pd-form" id="pd-form" hidden novalidate aria-labelledby="pd-form-title">
                        <div class="pd-form-head">
                            <span class="micro-label" id="pd-form-title">Edit profile</span>
                            <span class="pd-dirty" id="pd-dirty" hidden>Unsaved changes</span>
                        </div>
                        <div class="pd-form-fields" id="pd-form-fields"></div>
                        <p class="help-text pd-form-help">Enter saves, Escape cancels. Images are https links only; a preview loads from the image host.</p>
                        <p class="pd-form-status" id="pd-form-status" role="alert" hidden></p>
                        <div class="pd-actions">
                            <button id="pd-save" class="btn btn--primary btn--sm" type="submit">Save</button>
                            <button id="pd-cancel" class="btn btn--sm" type="button">Cancel</button>
                        </div>
                    </form>
                </div>
            </section>

            <p class="pd-privacy help-text" id="pd-privacy">Checking a picture or banner contacts the host of that image.</p>
        </main>
    </body>
</html>
