<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script defer src="event_history.build.js"></script>
        <link rel="stylesheet" href="/options.build.css" />
        <link rel="stylesheet" href="/instrument.css" />
        <link rel="stylesheet" href="event_history.css" />
        <title>Event History</title>
    </head>

    <body class="ins">
        <div class="eh-page">
            <header class="eh-header">
                <div>
                    <div class="micro-label">NostrKey &middot; Activity Readout</div>
                    <h1 class="eh-title">Signing log</h1>
                </div>
                <button id="close-btn" class="btn btn--ghost btn--sm" type="button" title="Close" aria-label="Close">
                    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"></path>
                    </svg>
                </button>
            </header>

            <div class="rack">
                <section class="module">
                    <div class="module-header">
                        Filter
                        <span class="header-end">
                            <span class="mono" id="event-count">0</span>
                            <span>shown</span>
                        </span>
                    </div>
                    <div class="module-body">
                        <div class="eh-grid">
                            <div class="eh-field">
                                <label for="view" class="micro-label">View</label>
                                <select id="view" class="eh-input">
                                    <option value="created_at">created_at</option>
                                    <option value="kind">kind</option>
                                    <option value="host">host</option>
                                    <option value="pubkey">pubkey</option>
                                </select>
                            </div>

                            <div class="eh-field">
                                <label for="sort" class="micro-label">Order</label>
                                <select id="sort" class="eh-input">
                                    <option value="asc">Ascending</option>
                                    <option value="desc">Descending</option>
                                </select>
                            </div>

                            <div class="eh-field">
                                <label for="max" class="micro-label">Max</label>
                                <input
                                    type="number"
                                    id="max"
                                    class="eh-input"
                                    min="10"
                                    value="100"
                                />
                            </div>

                            <div></div>

                            <div class="eh-field" data-filter="created_at">
                                <label for="fromCreatedAt" class="micro-label">From</label>
                                <input
                                    type="date"
                                    id="fromCreatedAt"
                                    class="eh-input"
                                />
                            </div>

                            <div class="eh-field" data-filter="created_at">
                                <label for="toCreatedAt" class="micro-label">To</label>
                                <input
                                    type="date"
                                    id="toCreatedAt"
                                    class="eh-input"
                                />
                            </div>

                            <div class="eh-field" data-filter="kind" hidden>
                                <label for="kindShortcut" class="micro-label">Quick Select</label>
                                <select id="kindShortcut" class="eh-input">
                                    <option></option>
                                </select>
                            </div>

                            <div class="eh-field" data-filter="kind" hidden>
                                <label for="fromKind" class="micro-label">From</label>
                                <input
                                    type="number"
                                    id="fromKind"
                                    class="eh-input"
                                    value="0"
                                />
                            </div>

                            <div class="eh-field" data-filter="kind" hidden>
                                <label for="toKind" class="micro-label">To</label>
                                <input
                                    type="number"
                                    id="toKind"
                                    class="eh-input"
                                    value="50000"
                                />
                            </div>

                            <div class="eh-field" data-filter="host" hidden>
                                <label for="host" class="micro-label">Host</label>
                                <select id="host" class="eh-input">
                                    <option value=""></option>
                                </select>
                            </div>

                            <div class="eh-field" data-filter="pubkey" hidden>
                                <label for="profiles" class="micro-label">Profiles</label>
                                <select id="profiles" class="eh-input">
                                    <option value=""></option>
                                </select>
                            </div>

                            <div class="eh-field" data-filter="pubkey" hidden>
                                <label for="pubkey" class="micro-label">Pubkey</label>
                                <input
                                    type="text"
                                    id="pubkey"
                                    class="eh-input"
                                />
                            </div>
                        </div>
                    </div>
                </section>

                <section class="module">
                    <div class="module-header">
                        Signed events
                        <span class="header-end">
                            <button id="save-all-btn" class="btn btn--sm" type="button">Save all</button>
                            <button id="delete-all-btn" class="btn btn--sm btn--destructive" type="button">Delete all</button>
                        </span>
                    </div>
                    <div class="eh-hint micro-label">
                        Click a row to expand &middot; click the JSON to copy the raw event
                    </div>
                    <div id="event-list"></div>
                </section>
            </div>
        </div>

        <div id="copied-toast" class="eh-toast mono" hidden aria-live="polite">
            Event copied
        </div>
    </body>
</html>
